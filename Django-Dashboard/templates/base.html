{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block metadescription %}Real-time sentiment analysis of tweets{% endblock %}">
    <title>{% block title %}Sentiment Hub{% endblock title %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22v-8M15 22V10M21 22v-5' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block links %}{% endblock links %}
</head>
<body>
<div class="shell">

    <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="{% url 'dashboard' %}">
            <span class="brand-mark" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
            </span>
            Sentiment Hub
        </a>
        <nav class="side-nav">
            <a class="nav-item{% if request.resolver_match.url_name == 'dashboard' %} is-active{% endif %}" href="{% url 'dashboard' %}"{% if request.resolver_match.url_name == 'dashboard' %} aria-current="page"{% endif %}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Dashboard
            </a>
            <a class="nav-item{% if request.resolver_match.url_name == 'classify' %} is-active{% endif %}" href="{% url 'classify' %}"{% if request.resolver_match.url_name == 'classify' %} aria-current="page"{% endif %}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
                Classify text
            </a>
        </nav>
    </aside>

    <div class="content">
        {% block content %}{% endblock content %}
    </div>

</div>
{% block scripts %}{% endblock scripts %}
</body>
</html>
